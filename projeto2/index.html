<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario</h1>
   
    <form  >
    <fieldset>
        <legend>Dados Pessoais</legend> 

        <label for="name"> nome:</label>
         <input type="text" size="50" id="name" nome="name" value=""><br>
         <br>
         <label for="date">Data de nascimento:</label>
         <input type="date" id="date" Data de aniversario="date" value=""><br><br>
        <label for="Endereço"> Endereço:</label>
        <input type="text" size="60" id="endereço" Endereço="endereço" value=""> <br> <br>
        <label for="bairro">Bairro:</label>
        <input type="text" size="40" id="bairro" Bairro="bairro" value=""> 
        <label for="cidade"> Cidade:</label>
        <input type="text" size="20" id="cidade" Cidade="cidade" value=""><br><br>
        <label for="cep"> CEP:</label>
        <input type="number" size="30" id="CEP" CEP="cep" value=""> 
        <label for="estado"> Estado:</label>
        <input type="text" size="20" id="estado" Estado="estado" value=""> <br> <br>
        <label for="Cor">Cor favorita:</label>
        <input type="color" id="Cor" Cor favorita="Cor" value=""> <br> <br>
        <label for="nivel de satisfação"> nivel de satisfação:</label>
        <input type="range" id="nivel" nivel de satisfação="nivel" min="0" max="100" value=""> <br> <br>
        
        

    </fieldset>

    <fieldset>
        <legend>Dados profissionais</legend>
        
        <label for="natureza"> Natureza do Cargo:</label> <br>
       
        <input type="radio" id="gerencia" name="natureza" value="Gerência">
        <label for="gerencia"> Gerência</label>
         <input type="radio" id="Financeiro" name="natureza" value="Financeiro">
        <label for="Financeiro"> Financeiro</label>
        <input type="radio" id="Recepcao" name="natureza" value="Recepcao">
        <label for="Recepcao"> Recepção</label>
        <input type="radio" id="Administrativo" name="natureza" value="Administrativo">
        <label for="Administrativo"> Administrativo</label>
        <input type="radio" id="Juridico" name="natureza" value="Juridico">
        <label for="Juridico"> Juridíco</label><br><br>

        <label for="area"> Àrea de interesse:</label> <br>
       
        <input type="radio" id="Computacao" name="area" value="Computacao">
        <label for="Computacao"> Computação</label>
         <input type="radio" id="quimica" name="area" value="quimica">
        <label for="quimica"> Quimica</label>
        <input type="radio" id="meioambiente" name="area" value="meioambiente">
        <label for="meioambiente"> Meio Ambiente</label>
        <input type="radio" id="Engenharia" name="area" value="Engenharia">
        <label for="Engenharia"> Engenharia</label>
        <input type="radio" id="Matematica" name="area" value="Matematica">
        <label for="Matematica"> Matematica</label>

    </fieldset>
    
    <input type="submit" value="enviar">
    <input type="submit" value="limpar">
    </form>
</body>
</html>
